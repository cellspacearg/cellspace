<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra | Cell Space Argentina</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css?v=15">
  <link rel="stylesheet" href="css/tienda.css?v=2">
  <link rel="stylesheet" href="css/cms-public.css?v=1">
  <link rel="stylesheet" href="css/cs-auth.css?v=1">
  <link rel="stylesheet" href="css/responsive.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () { emailjs.init("EYej4cfwI1OIadkG5"); })();
  </script>
  <style>
    .cf-box { background: rgba(21,21,21,0.95); border: 1px solid rgba(255,106,0,0.3); border-radius: 20px; padding: 30px; }
    .cf-group { margin-bottom: 15px; }
    .cf-group label { display:block; color:white; font-weight:600; margin-bottom:6px; font-size:13px; }
    .cf-group input, .cf-group select, .cf-group textarea {
      width:100%; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
      border-radius:10px; color:white; font-family:'Montserrat',sans-serif; outline:none; font-size:14px;
    }
    .cf-group select { cursor:pointer; }
    .cf-row2 { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .cf-row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; }
    .cf-section-title { color:white; font-size:16px; font-weight:700; margin:25px 0 15px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); }
    .cf-section-title:first-child { margin-top:0; padding-top:0; border-top:none; }
    .cf-check { display:flex; align-items:center; gap:10px; color:white; font-size:14px; margin-bottom:15px; cursor:pointer; }
    .pay-option { display:flex; gap:12px; align-items:flex-start; padding:14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.12); border-radius:10px; cursor:pointer; color:white; font-size:14px; }
    .pay-option:has(input:checked) { border-color: var(--orange); background: rgba(255,106,0,0.08); }
    .pay-option input { margin-top:3px; accent-color: var(--orange); }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <header class="site-header">
    <div class="header-top">
      <div class="container">
        <div class="header-top-content">
          <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="Cell Space">
            <div class="logo-text">
              <span class="logo-main">CELL SPACE</span>
              <span class="logo-sub">ARGENTINA</span>
            </div>
          </a>
          <div class="header-actions">
            <a href="tienda.html" class="header-action"><i class="fas fa-arrow-left"></i><span>Volver a la tienda</span></a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="shop-main">
    <div class="container" style="max-width:900px;">
      <h1 class="shop-title" style="margin:30px 0;">FINALIZAR COMPRA</h1>

      <div id="emptyCartMsg" style="display:none; text-align:center; padding:60px 20px; color:#888;">
        <i class="fas fa-shopping-cart" style="font-size:48px; margin-bottom:15px;"></i>
        <p>Tu carrito está vacío.</p>
        <a href="tienda.html" class="btn-service-primary" style="display:inline-block;margin-top:15px;">Ir a la tienda</a>
      </div>

      <div id="checkoutContent" style="display:grid; grid-template-columns: 1.3fr 1fr; gap:30px; align-items:start;">

        <!-- FORMULARIO -->
        <div class="cf-box">
          <form id="checkoutForm">

            <div class="cf-section-title"><i class="fas fa-user" style="color:var(--orange);"></i> Datos de facturación</div>

            <div class="cf-row2">
              <div class="cf-group"><label>Nombre *</label><input type="text" id="firstName" required></div>
              <div class="cf-group"><label>Apellido *</label><input type="text" id="lastName" required></div>
            </div>
            <div class="cf-group"><label>Nombre de la empresa (opcional)</label><input type="text" id="company"></div>

            <div class="cf-row2">
              <div class="cf-group"><label>Tipo de documento *</label>
                <select id="documentType" required>
                  <option value="DNI">DNI</option>
                  <option value="CUIT">CUIT</option>
                  <option value="Pasaporte">Pasaporte</option>
                </select>
              </div>
              <div class="cf-group"><label>Número de documento *</label><input type="text" id="documentNumber" required></div>
            </div>

            <div class="cf-group"><label>Condición fiscal *</label>
              <select id="taxCondition" required>
                <option value="CF - Consumidor Final">CF - Consumidor Final</option>
                <option value="Responsable Inscripto">Responsable Inscripto</option>
                <option value="Monotributista">Monotributista</option>
                <option value="Exento">Exento</option>
              </select>
            </div>

            <div class="cf-group"><label>Calle *</label><input type="text" id="billStreet" required></div>
            <div class="cf-row3">
              <div class="cf-group"><label>Altura *</label><input type="text" id="billNumber" required></div>
              <div class="cf-group"><label>Piso (opcional)</label><input type="text" id="billFloor"></div>
              <div class="cf-group"><label>Depto (opcional)</label><input type="text" id="billApartment"></div>
            </div>
            <div class="cf-row2">
              <div class="cf-group"><label>Código postal *</label><input type="text" id="billPostal" required></div>
              <div class="cf-group"><label>Provincia *</label>
                <select id="billProvince" required>
                  <option value="">Seleccionar...</option>
                  <option>Buenos Aires</option><option>CABA</option><option>Catamarca</option>
                  <option>Chaco</option><option>Chubut</option><option>Córdoba</option>
                  <option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option>
                  <option>Jujuy</option><option>La Pampa</option><option>La Rioja</option>
                  <option>Mendoza</option><option>Misiones</option><option>Neuquén</option>
                  <option>Río Negro</option><option>Salta</option><option>San Juan</option>
                  <option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option>
                  <option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
                </select>
              </div>
            </div>
            <div class="cf-group"><label>Localidad *</label><input type="text" id="billCity" required></div>

            <div class="cf-row2">
              <div class="cf-group"><label>Teléfono *</label><input type="tel" id="buyerPhone" required placeholder="3782-XXXXXX"></div>
              <div class="cf-group"><label>Email *</label><input type="email" id="buyerEmail" required></div>
            </div>

            <label class="cf-check">
              <input type="checkbox" id="shipDifferent" style="accent-color:var(--orange);width:16px;height:16px;">
              Enviar a una dirección diferente
            </label>

            <div id="shippingBlock" style="display:none;">
              <div class="cf-section-title"><i class="fas fa-truck" style="color:var(--orange);"></i> Dirección de envío</div>
              <div class="cf-group"><label>Calle *</label><input type="text" id="shipStreet"></div>
              <div class="cf-row3">
                <div class="cf-group"><label>Altura *</label><input type="text" id="shipNumber"></div>
                <div class="cf-group"><label>Piso (opcional)</label><input type="text" id="shipFloor"></div>
                <div class="cf-group"><label>Depto (opcional)</label><input type="text" id="shipApartment"></div>
              </div>
              <div class="cf-row2">
                <div class="cf-group"><label>Código postal *</label><input type="text" id="shipPostal"></div>
                <div class="cf-group"><label>Provincia *</label>
                  <select id="shipProvince">
                    <option value="">Seleccionar...</option>
                    <option>Buenos Aires</option><option>CABA</option><option>Catamarca</option>
                    <option>Chaco</option><option>Chubut</option><option>Córdoba</option>
                    <option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option>
                    <option>Jujuy</option><option>La Pampa</option><option>La Rioja</option>
                    <option>Mendoza</option><option>Misiones</option><option>Neuquén</option>
                    <option>Río Negro</option><option>Salta</option><option>San Juan</option>
                    <option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option>
                    <option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
                  </select>
                </div>
              </div>
              <div class="cf-group"><label>Localidad *</label><input type="text" id="shipCity"></div>
            </div>

            <div class="cf-section-title" style="margin-top:15px;"><i class="fas fa-truck-fast" style="color:var(--orange);"></i> Envío</div>
            <p style="color:#aaa; font-size:13px; background:rgba(255,106,0,0.08); border:1px solid rgba(255,106,0,0.2); border-radius:8px; padding:12px 14px;">
              Coordinamos el envío por WhatsApp una vez confirmado tu pedido (Andreani, OCA o el medio que prefieras).
            </p>

            <div class="cf-group">
              <label>Notas del pedido (opcional)</label>
              <textarea id="orderNotes" rows="3" placeholder="Notas sobre tu pedido, por ejemplo: horario de entrega, referencias, etc."></textarea>
            </div>

            <div class="cf-section-title"><i class="fas fa-credit-card" style="color:var(--orange);"></i> Método de pago</div>
            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
              <label class="pay-option">
                <input type="radio" name="payMethod" value="mercadopago" checked>
                <span><strong>Mercado Pago</strong><br><small style="color:#888;">Tarjeta, débito o dinero en cuenta — pago inmediato</small></span>
              </label>
              <label class="pay-option">
                <input type="radio" name="payMethod" value="transferencia">
                <span><strong>Transferencia bancaria</strong><br><small style="color:#888;">Te mandamos los datos y confirmás por WhatsApp</small></span>
              </label>
              <label class="pay-option">
                <input type="radio" name="payMethod" value="binance">
                <span><strong>Binance (USDT)</strong><br><small style="color:#888;">Para compras desde el exterior — confirmás por WhatsApp</small></span>
              </label>
            </div>

            <button type="submit" id="checkoutSubmitBtn" class="btn-service-primary" style="width:100%; padding:16px; font-size:16px;">
              <span id="checkoutBtnText"><i class="fas fa-lock"></i> Confirmar pedido</span>
              <span id="checkoutBtnLoader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Procesando...</span>
            </button>
          </form>
        </div>

        <!-- RESUMEN -->
        <div class="cf-box" style="padding:25px;">
          <h2 style="color:white; font-size:18px; margin-bottom:20px;"><i class="fas fa-receipt" style="color:var(--orange);"></i> Tu pedido</h2>
          <div id="orderItemsList" style="display:flex; flex-direction:column; gap:14px; margin-bottom:20px;"></div>
          <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:15px; display:flex; justify-content:space-between; font-size:18px; font-weight:800; color:white;">
            <span>Total</span>
            <span id="orderTotal" style="color:var(--orange);">$0</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/site-config.js?v=2"></script>
  <script src="js/cs-auth.js?v=1"></script>
  <script src="js/checkout.js"></script>

  <a href="https://wa.me/5493782437674" target="_blank" class="wa-float" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
</body>
</html>
