<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Central Space | Cell Space Argentina</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/central-space.css?v=1">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="cs-body">

  <!-- ===== Pantalla de carga / acceso ===== -->
  <div class="cs-gate" id="csGate">
    <div class="cs-gate-box" id="csGateBox">
      <div class="cs-gate-logo"><img src="assets/logo.png" alt="Cell Space"></div>
      <i class="fas fa-spinner fa-spin cs-gate-spin"></i>
      <p>Verificando acceso…</p>
    </div>
  </div>

  <!-- ===== Panel ===== -->
  <div class="cs-app" id="csApp" hidden>

    <!-- Sidebar -->
    <aside class="cs-sidebar" id="csSidebar">
      <div class="cs-side-head">
        <a href="index.html" class="cs-side-brand">
          <img src="assets/logo.png" alt="Cell Space" width="34" height="34">
          <span><strong>CELL</strong> SPACE</span>
        </a>
        <button class="cs-side-close" id="csSideClose" aria-label="Cerrar menú">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="cs-nav" id="csNav">
        <div class="cs-nav-skeleton"></div>
      </nav>

      <div class="cs-vip-card">
        <span class="cs-vip-crown"><i class="fas fa-crown"></i></span>
        <div class="cs-vip-title">ÚNETE A<br><strong>CELL <span>SPACE</span></strong><br>VIP TECH</div>
        <ul class="cs-vip-list">
          <li><i class="fas fa-star"></i> Acceso a contenido premium</li>
          <li><i class="fas fa-star"></i> Herramientas exclusivas</li>
          <li><i class="fas fa-star"></i> Soporte prioritario</li>
          <li><i class="fas fa-star"></i> Actualizaciones diarias</li>
        </ul>
        <a href="#/vip" class="cs-vip-btn">VER PLANES</a>
      </div>

      <div class="cs-side-foot">
        <p>&copy; 2026 Cell Space Argentina</p>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al sitio</a>
      </div>
    </aside>

    <div class="cs-backdrop" id="csBackdrop"></div>

    <!-- Contenido -->
    <div class="cs-main">

      <header class="cs-topbar">
        <button class="cs-burger" id="csBurger" aria-label="Abrir menú">
          <i class="fas fa-bars"></i>
        </button>

        <div class="cs-search">
          <i class="fas fa-search"></i>
          <input type="text" id="csSearch" placeholder="Buscar herramientas, guías, modelos…" enterkeyhint="search">
        </div>

        <div class="cs-top-actions">
          <button class="cs-icon-btn" id="csNotifBtn" aria-label="Notificaciones">
            <i class="fas fa-bell"></i>
            <span class="cs-dot" id="csNotifDot" hidden></span>
          </button>
          <button class="cs-avatar-btn" id="csAvatarBtn" aria-label="Mi perfil">
            <span id="csAvatarInitials">--</span>
          </button>
        </div>
      </header>

      <main class="cs-view" id="csView">
        <div class="cs-loading"><i class="fas fa-spinner fa-spin"></i><p>Cargando…</p></div>
      </main>

      <footer class="cs-foot">
        <span>&copy; 2026 Cell Space Argentina</span>
        <span class="cs-foot-status"><i class="fas fa-circle"></i> Sistema online</span>
      </footer>
    </div>
  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/central-space.js?v=1"></script>
</body>
</html>
