<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Reparación - Cell Space</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css?v=17">
  <link rel="stylesheet" href="css/reparaciones.css">
  <link rel="stylesheet" href="css/cms-public.css?v=1">
  <link rel="stylesheet" href="css/cs-auth.css?v=1">
  <link rel="stylesheet" href="css/responsive.css?v=3">

  <!-- Supabase SDK (Reemplaza a Firebase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous"></script>

  <style>
    .track-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(233,123,30,0.25); border-radius: 16px; padding: 22px; margin-top: 20px; }
    .track-status { display: inline-block; padding: 7px 16px; border-radius: 999px; background: linear-gradient(135deg, #e97b1e, #c9600f); color: #fff; font-weight: 700; font-size: 13px; margin-bottom: 16px; }
    .track-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14.5px; color: #eee; }
    .track-row:last-child { border-bottom: none; }
    .track-row .label { color: rgba(255,255,255,0.5); }
    .track-empty { text-align: center; color: #e97b1e; padding: 20px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <!-- HEADER LIMPIO PARA RASTREO -->
  <header class="tech-header">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
    <div class="header-content">
      <h1>Sistema <span>Técnico</span></h1>
      <p>Seguimiento de reparaciones en tiempo real</p>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="tech-content">
    <div class="card">
      <h2><i class="fas fa-search" style="color: var(--orange);"></i> Rastrear mi equipo</h2>
      <p class="subtitle">Ingresá el número de orden para ver el estado de tu reparación.</p>

      <div class="search-box">
        <input type="text" id="orderInput" placeholder="Ej: B3JKJD53" maxlength="15">
        <button onclick="trackOrder()" class="btn-track">
          <i class="fas fa-search"></i> Buscar
        </button>
      </div>
      <p class="hint">💡 ¿No tenés tu número de orden? Consultalo en tu comprobante o <a href="https://wa.me/5493782437674" target="_blank">escribinos por WhatsApp</a></p>

      <div id="trackResult" class="result-container"></div>
    </div>
  </main>

  <!-- SCRIPTS (LIMPIOS Y SIN DUPLICADOS) -->
  <script src="js/config.js"></script>
  <script src="js/auth-middleware.js"></script>
  <script src="js/reparaciones.js"></script>
  <script src="js/site-config.js?v=1"></script>
  <script src="js/cs-auth.js?v=1"></script>

<script>
const NESPACE_SUPABASE_URL = 'https://omrijasovabxprqqxhpk.supabase.co';
const NESPACE_ANON_KEY = 'sb_publishable_hcN9hqNU0Mb4pQHNN2SuKA_C9_mDWO0';

const NESPACE_STATUS_LABELS = {
  recibido: 'Recibido', diagnostico: 'En diagnóstico', presupuestado: 'Presupuestado',
  aprobado: 'Aprobado', esperando_repuesto: 'Esperando repuesto', reparando: 'En reparación',
  listo: 'Listo para entregar', entregado: 'Entregado', sin_reparacion: 'Sin reparación',
};

async function trackOrder() {
  const codigo = document.getElementById('orderInput').value.trim();
  const resultado = document.getElementById('trackResult');
  if (!codigo) return;

  resultado.innerHTML = '<p>Buscando...</p>';
  try {
    const res = await fetch(`${NESPACE_SUPABASE_URL}/rest/v1/rpc/public_track_order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: NESPACE_ANON_KEY },
      body: JSON.stringify({ p_tracking_code: codigo }),
    });
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) {
      resultado.innerHTML = '<div class="track-empty">No encontramos una orden con ese código.</div>';
      return;
    }
    const o = rows[0];
    const equipo = [o.device_brand, o.device_model].filter(Boolean).join(' ');
    resultado.innerHTML = `
      <div class="track-card">
        <div class="track-status">${NESPACE_STATUS_LABELS[o.status] || o.status}</div>
        ${equipo ? `<div class="track-row"><span class="label">Equipo</span><span>${equipo}</span></div>` : ''}
        ${o.balance != null ? `<div class="track-row"><span class="label">Saldo</span><span>$${Number(o.balance).toLocaleString('es-AR')}</span></div>` : ''}
        ${o.delivery_date ? `<div class="track-row"><span class="label">Entrega estimada</span><span>${o.delivery_date}</span></div>` : ''}
      </div>`;
  } catch (err) {
    resultado.innerHTML = '<div class="track-empty">Hubo un error al consultar. Probá de nuevo en un momento.</div>';
    console.error(err);
  }
}

// Si llegan desde el QR (ej: reparaciones.html?codigo=B3LUJS5E), autocompletar y buscar solo.
(function () {
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo');
  if (codigo) {
    document.getElementById('orderInput').value = codigo;
    trackOrder();
  }
})();
</script>

  <a href="https://wa.me/5493782437674" target="_blank" class="wa-float" aria-label="WhatsApp">
  <i class="fab fa-whatsapp"></i>
</a>
</body>
</html>
