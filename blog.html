<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Cell Space Argentina</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css?v=15">
  <link rel="stylesheet" href="css/cms-public.css?v=1">
  <link rel="stylesheet" href="css/blog-public.css?v=1">
  <link rel="stylesheet" href="css/cs-auth.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-top">
      <div class="container">
        <div class="header-top-content">
          <a href="index.html" class="logo"><img src="assets/logo.png" alt="Cell Space Argentina"><div class="logo-text"><span class="logo-main">CELL SPACE</span><span class="logo-sub">ARGENTINA</span></div></a>
          <div class="header-actions">
            <a href="index.html" class="header-action"><i class="fas fa-home"></i><span>Inicio</span></a>
            <a href="tienda.html" class="header-action"><i class="fas fa-store"></i><span>Tienda</span></a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="blog-main">
    <div class="container">
      <header class="blog-masthead blog-reveal">
        <div class="bm-left">
          <span class="bm-kicker"><span class="bm-dot"></span> Bitácora del taller</span>
          <h1 class="bm-title">Notas, guías<br><em>y novedades</em></h1>
          <p class="bm-lead">Lo que aprendemos reparando, lo que probamos y lo que conviene saber antes de pasar por el mostrador.</p>
        </div>
        <div class="bm-right">
          <div class="bm-search"><i class="fas fa-search"></i><input type="text" id="blogSearch" placeholder="Buscar en el blog..."></div>
          <span class="bm-count" id="blogCount"></span>
        </div>
      </header>

      <div class="blog-chips blog-reveal" id="blogChips"></div>
      <div id="blogBody"><div class="blog-loading"><i class="fas fa-spinner fa-spin"></i></div></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Cell Space Argentina. Todos los derechos reservados.</p></div>
    </div>
  </footer>

  <script src="js/config.js?v=2"></script>
  <script src="js/blog-public.js?v=1"></script>
  <script src="js/site-config.js?v=3"></script>
  <script src="js/cs-auth.js?v=1"></script>
</body>
</html>
