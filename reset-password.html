<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Nueva contraseña | Cell Space Argentina</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/styles.css?v=16">
  <link rel="stylesheet" href="css/responsive.css?v=2">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="login-page">
    <div class="login-container">
      <div class="login-box">

        <div class="login-header">
          <img src="assets/logo.png" alt="Cell Space" class="login-logo">
          <h1>Nueva contraseña</h1>
          <p id="rpSubtitle">Elegí una contraseña nueva para tu cuenta.</p>
        </div>

        <div id="rpAlert"></div>

        <div id="rpFormWrap">
          <div class="form-group">
            <label for="rpPass"><i class="fas fa-lock"></i> Contraseña nueva</label>
            <input type="password" id="rpPass" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
          </div>

          <div class="form-group">
            <label for="rpPass2"><i class="fas fa-lock"></i> Repetila</label>
            <input type="password" id="rpPass2" autocomplete="new-password" placeholder="Escribila de nuevo">
          </div>

          <button type="button" class="btn-primary btn-block" id="rpBtn">
            <i class="fas fa-check"></i> Guardar contraseña
          </button>
        </div>

        <div class="login-footer">
          <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
        </div>

      </div>
    </div>
  </main>

  <a href="https://wa.me/5493782437674" target="_blank" rel="noopener" class="wa-float" aria-label="WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script src="js/config.js?v=2"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);

    function alertBox(type, html) {
      $('rpAlert').innerHTML = `<div class="alert-${type}">${html}</div>`;
    }

    // El enlace del email trae el token en el hash. supabase-js lo procesa
    // solo y dispara PASSWORD_RECOVERY, pero puede tardar un instante.
    let listo = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || session) {
        listo = true;
        $('rpFormWrap').style.display = 'block';
      }
    });

    setTimeout(async () => {
      if (listo) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        listo = true;
        $('rpFormWrap').style.display = 'block';
      } else {
        $('rpFormWrap').style.display = 'none';
        $('rpSubtitle').textContent = '';
        alertBox('error',
          'Este enlace no es válido o ya venció. Los enlaces de recuperación duran una hora y se usan una sola vez.<br><br>' +
          '<a href="login.html" style="color:#FF6A00;font-weight:700;">Pedí uno nuevo desde el login</a>');
      }
    }, 1800);

    $('rpBtn').addEventListener('click', async () => {
      const p1 = $('rpPass').value;
      const p2 = $('rpPass2').value;

      if (p1.length < 8) { alertBox('error', 'La contraseña tiene que tener al menos 8 caracteres.'); return; }
      if (p1 !== p2)     { alertBox('error', 'Las dos contraseñas no coinciden.'); return; }

      const btn = $('rpBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

      try {
        const { error } = await supabase.auth.updateUser({ password: p1 });
        if (error) throw error;

        $('rpFormWrap').style.display = 'none';
        alertBox('success', '✅ Contraseña actualizada. Ya podés iniciar sesión.');
        setTimeout(() => { window.location.href = 'login.html'; }, 2200);
      } catch (e) {
        alertBox('error', e.message || 'No se pudo actualizar la contraseña.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Guardar contraseña';
      }
    });
  })();
  </script>
</body>
</html>
